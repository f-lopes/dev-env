name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint scripts and validate the mise manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Trust the config
        run: mise trust .

      - name: Lint shell scripts
        run: mise x aqua:koalaman/shellcheck -- shellcheck scripts/*.sh .githooks/pre-commit

      - name: Validate the bootstrap manifest
        run: mise bootstrap --dry-run --skip tools

  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
