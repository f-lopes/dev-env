# =============================================================================
# Project-scoped tools.
#
# Everyday tools (java, maven, go, terraform, starship, the CLI utilities and
# the Kubernetes tools) live in the chezmoi-managed global config at
# ~/.config/mise/config.toml, which is the source of truth for them. Only
# chezmoi (needed to bootstrap that config) and heavy, occasional tools are
# declared here.
# =============================================================================

[tools]
chezmoi = "latest"                              # Dotfiles manager (applies the global config)
cmake = "latest"                                # Build system generator
"aqua:kubernetes-sigs/kind" = "latest"          # Kubernetes in Docker (local clusters)
"aqua:GoogleContainerTools/skaffold" = "latest" # Kubernetes dev workflow
"aqua:aquasecurity/trivy" = "latest"            # Container security scanning
"aqua:infracost/infracost" = "latest"           # Terraform cost estimates
"npm:@jetbrains/junie-cli" = { version = "latest", allow_low_downloads = true }  # Junie CLI

# =============================================================================
# Excluded tools (per user request)
# =============================================================================
# python  — excluded, will use Docker
# ansible — excluded, will use Docker
# tmux    — replaced by zellij

# =============================================================================
# GUI apps (not installable via mise, use bootstrap or manual install)
# =============================================================================
# ghostty — macOS GUI terminal, install via `brew install --cask ghostty`
# warp    — macOS GUI terminal, install via `brew install --cask warp`

# =============================================================================
# Bootstrap — system packages managed by mise bootstrap
# =============================================================================

[bootstrap.packages]
# macOS packages
"brew:zsh" = { version = "latest", os = "macos" }
"brew:git" = { version = "latest", os = "macos" }
"brew:htop" = { version = "latest", os = "macos" }
"brew-cask:vagrant" = { version = "latest", os = "macos" }       # Cask, not a formula
"brew-cask:orbstack" = { version = "latest", os = "macos" }      # Replaces Docker Desktop; bundles Docker CLI
"brew-cask:raycast" = { version = "latest", os = "macos" }       # macOS launcher app
"brew-cask:ghostty" = { version = "latest", os = "macos" }       # Modern terminal emulator
# warp — removed from bootstrap; app.warp.dev/download/brew returns 404.
# Install manually: brew install --cask warp
"brew-cask:1password-cli" = { version = "latest", os = "macos" } # 1Password CLI (op command)

# Linux packages
"apt:zsh" = { version = "latest", os = "linux" }
"apt:git" = { version = "latest", os = "linux" }
"apt:curl" = { version = "latest", os = "linux" }
"apt:htop" = { version = "latest", os = "linux" }
"apt:vagrant" = { version = "latest", os = "linux" }
"apt:docker-ce" = { version = "latest", os = "linux" }           # Docker runtime (OrbStack is macOS-only)
"apt:build-essential" = { version = "latest", os = "linux" }
"apt:sudo" = { version = "latest", os = "linux" }
"apt:software-properties-common" = { version = "latest", os = "linux" }
"apt:acl" = { version = "latest", os = "linux" }

# =============================================================================
# Bootstrap repos — cloned before tools, applied by the post-tools hook
# =============================================================================

[bootstrap.repos."{{env.HOME}}/.local/share/chezmoi"]
url = "{{ env.CHEZMOI_DOTFILES_REPO | default(value='https://github.com/f-lopes/dotfiles.git') }}"
ref = "main"

# =============================================================================
# Bootstrap user — login shell
# =============================================================================

[bootstrap.user]
login_shell = "zsh"

# =============================================================================
# Bootstrap hooks — run after packages are installed
# =============================================================================

[bootstrap.hooks.post-packages]
run = """
  # Oh My Zsh installation and plugin configuration
  if command -v zsh >/dev/null 2>&1 && [ ! -d "$HOME/.oh-my-zsh" ]; then
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
    echo "✓ Oh My Zsh installed"
  fi

  # Nerd Fonts installation (macOS only); non-fatal so a cask hiccup does not
  # abort the whole bootstrap run
  if [[ "$(uname)" == "Darwin" ]] && command -v brew >/dev/null 2>&1; then
    brew install --cask font-hack-nerd-font || true
    brew install --cask font-jetbrains-mono-nerd-font || true
    echo "✓ Nerd Fonts installed"
  fi
"""

[bootstrap.hooks.post-tools]
run = """
  # Apply the dotfiles checkout cloned by [bootstrap.repos]
  if command -v chezmoi >/dev/null 2>&1 && [ -d "$HOME/.local/share/chezmoi" ]; then
    chezmoi apply --source "$HOME/.local/share/chezmoi"
    echo "✓ chezmoi dotfiles applied"
  fi
"""
